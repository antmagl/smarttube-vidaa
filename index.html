<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>SmartTube for VIDAA</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  iframe{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;background:#000}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b0b0b;color:#bbb;
    font:28px/1.5 Arial,sans-serif;text-align:center;z-index:2}
  #loading.hidden{display:none}
  #loading strong{display:block;color:#fff;font-size:40px;margin-bottom:14px}
</style></head><body>
<div id="loading"><div><strong>SmartTube for VIDAA</strong>Starting the app…</div></div>
<iframe id="app" src="app.html" title="SmartTube for VIDAA"
  sandbox="allow-scripts allow-forms allow-popups allow-modals"
  allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
<script>
(function () {
  var frame = document.getElementById('app');
  var loading = document.getElementById('loading');

  function focusApp() {
    try { frame.focus(); } catch (_) {}
    try { frame.contentWindow.focus(); } catch (_) {}
  }
  function showApp() { focusApp(); }

  frame.addEventListener('load', function () {
    loading.className = 'hidden';
    focusApp();
    setTimeout(focusApp, 250);
    setTimeout(focusApp, 1200);
  });
  document.addEventListener('click', focusApp);
  document.addEventListener('mouseover', focusApp);

  // The sandboxed app has an opaque origin (Origin: null), which is what lets
  // YouTube's API endpoints answer it. If focus sits on this loader instead of
  // the iframe, forward remote keys so the app still receives them.
  var forward = {
    ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
    Enter: 1, NumpadEnter: 1, Select: 1, OK: 1,
    MediaPlayPause: 1, MediaPlay: 1, MediaPause: 1, MediaStop: 1
  };
  var forwardCodes = {37: 1, 38: 1, 39: 1, 40: 1, 13: 1, 179: 1, 415: 1, 19: 1, 178: 1, 413: 1};
  document.addEventListener('keydown', function (event) {
    if (!(forward[event.key] || forwardCodes[event.keyCode])) return;
    try {
      frame.contentWindow.postMessage({
        type: 'smarttube-key', key: event.key, keyCode: event.keyCode, which: event.which
      }, '*');
      event.preventDefault();
      event.stopPropagation();
    } catch (_) { focusApp(); }
  }, true);

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'smarttube-exit') {
      // The TV normally consumes Back itself. This is only a fallback for
      // builds that deliver the key to JavaScript.
      var names = ['Hisense_FinishApp', 'Hisense_ExitApp', 'Hisense_CloseApp'];
      for (var i = 0; i < names.length; i++) {
        try { if (typeof window[names[i]] === 'function') { window[names[i]](); return; } } catch (_) {}
      }
      try { window.close(); } catch (_) {}
      showApp();
    } else if (data.type === 'smarttube-focus') {
      focusApp();
    }
  });
})();
</script>
</body></html>
